<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Outreach</title>
    <link rel="stylesheet" href="stylesFinal.css">
</head>
<body>

    <header class="header">
        <div class="logo-bar">
            <div class="container">
                <div class="logo">Campus Outreach</div>
            </div>
        </div>

        <div class="nav-bar-wrapper">
            <nav class="nav-bar" id="main-nav">
                <a href="finalIndex.html" class="nav-link">Home</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="mission.html" class="nav-link">Mission</a>
                <a href="people.html" class="nav-link">People</a>
                <a href="prayer.html" class="nav-link current">Prayer Requests</a>
            </nav>
        </div>
    </header>   
<main>
        <section id="prayer" class="section active">
            <h2 class="section-title">Submit a Prayer Request</h2>
            
            <div class="prayer-section-content">
                
                <div class="form-box">
                    <p class="form-description">
                        We believe in the power of prayer. Share your requests with our staff team, and we will commit to praying for you.
                    </p>
                    <form action="mailto:prayer@campusoutreach.org" method="POST" enctype="text/plain" class="form-group-wrapper">
                        <div class="form-group">
                            <label for="prayer_name">Your Name (Optional)</label>
                            <input type="text" id="prayer_name" name="Name">
                        </div>
                        <div class="form-group">
                            <label for="prayer_request">Prayer Request</label>
                            <textarea id="prayer_request" name="Request" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="submit-button" style="background-color: var(--co-accent);">
                            Submit Prayer Request
                        </button>
                    </form>
                </div>
                
                <div class="cross-image-container">
                    <img src="cross.png" alt="Golden Cross Symbol" class="cross-image">
                </div>
                
            </div>
        </section>
    </main>
    <footer class="text-center py-4 text-sm mt-8" style="background-color: var(--co-primary); color: white;">
        &copy; 2025 Campus Outreach. All Rights Reserved.
    </footer>

</body>
</html>
